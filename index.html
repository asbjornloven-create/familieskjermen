<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Familien">
<meta name="theme-color" content="#14213d">
<title>Familieskjermen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2b5c99;--bg2:#5b93c9;--bg3:#9cc3e4;--accent:#ffe08a;--card:rgba(255,255,255,.13);--line:rgba(255,255,255,.22);--muted:rgba(255,255,255,.74);--r:24px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Outfit',system-ui,-apple-system,sans-serif;color:#fff;background:var(--bg1);overflow-x:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
@keyframes bgmove{0%,100%{background-position:0% 40%}50%{background-position:100% 60%}}
#bg{position:fixed;inset:0;z-index:0;background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));background-size:220% 220%;animation:bgmove 40s ease-in-out infinite}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#veil{position:fixed;inset:0;background:radial-gradient(ellipse at 50% -10%,rgba(18,24,60,.55),rgba(3,5,16,.86) 70%);opacity:0;transition:opacity 2.5s;pointer-events:none;z-index:0}
body[data-mode=night] #veil{opacity:1}
#app{position:relative;z-index:1;min-height:100vh;padding:max(18px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));display:grid;gap:16px;grid-template-columns:minmax(0,1fr);grid-template-areas:"top" "left" "family" "week";max-width:1700px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);box-shadow:0 12px 40px rgba(0,0,0,.14);transition:background 1s}
body[data-mode=night] .card,body[data-mode=night] .mtile{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.12)}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.16em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.top{grid-area:top;display:flex;gap:16px;align-items:stretch;flex-wrap:wrap}
.greet{flex:1 1 300px;display:flex;flex-direction:column;justify-content:center;padding:2px 4px;min-width:0}
.greet .fam{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
.greet h1{font-size:clamp(28px,3.4vw,48px);font-weight:700;letter-spacing:-.02em;line-height:1.08;margin-top:2px}
.greet .date{font-size:clamp(16px,1.5vw,22px);color:var(--muted);margin-top:4px}
.greet .date b{color:#fff;font-weight:600}
.banner{margin-top:12px;display:inline-flex;align-self:flex-start;gap:10px;align-items:center;padding:9px 18px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.35);font-weight:600;font-size:clamp(15px,1.4vw,19px);animation:glow 3.5s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.0)}50%{box-shadow:0 0 28px 2px rgba(255,255,255,.28)}}
.hist{flex:0 1 330px;min-width:220px;overflow:hidden;cursor:pointer}
.hist .body{transition:opacity .6s,transform .6s;margin-top:8px}
.hist .body.fade{opacity:0;transform:translateY(6px)}
.hist .yr{font-size:30px;font-weight:800;color:var(--accent);line-height:1}
.hist .ago{font-size:13px;color:var(--muted);margin-left:8px;font-weight:500}
.hist .txt{font-size:15.5px;line-height:1.38;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.music{flex:0 1 290px;min-width:220px;display:flex;align-items:center;gap:12px;cursor:pointer;padding:12px 14px}
.music .art,.np .art{width:60px;height:60px;border-radius:14px;object-fit:cover;flex:0 0 auto;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:28px;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.music .mt{flex:1;min-width:0;line-height:1.25}
.music .mt b,.music .mt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music .mt small{color:var(--muted);font-size:13.5px}
.music .eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px;margin-right:6px}
.music .eq i{width:3px;background:#1ed760;border-radius:1px;animation:eq .9s ease-in-out infinite}
.music .eq i:nth-child(2){animation-delay:.2s}.music .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{0%,100%{height:3px}50%{height:12px}}
.pbtn{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:17px;cursor:pointer;flex:0 0 auto;display:grid;place-items:center}
.pbtn.big{width:66px;height:66px;font-size:26px;background:#1ed760;color:#0b2414}
.pbtn:active{transform:scale(.92)}
.np{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.np .art{width:190px;height:190px;border-radius:22px;font-size:70px}
.np .ti{font-size:26px;font-weight:700;line-height:1.15}
.np .ar{color:var(--muted);font-size:17px;margin-top:4px}
.prog{height:6px;border-radius:3px;background:rgba(255,255,255,.18);margin:16px 0 4px;overflow:hidden}.prog i{display:block;height:100%;background:#1ed760}
.ptime{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{padding:0;height:6px;accent-color:#1ed760;border:0;background:transparent}
.pls{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.pl{cursor:pointer;background:rgba(255,255,255,.06);border-radius:16px;padding:8px;border:1px solid rgba(255,255,255,.1);color:#fff;font:inherit;text-align:left}
.pl:active{transform:scale(.96)}
.pl .im{width:100%;aspect-ratio:1/1;border-radius:11px;object-fit:cover;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:36px}
.pl span{display:block;font-size:13.5px;font-weight:500;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
iframe.spemb{width:100%;height:352px;border:0;border-radius:14px;margin-top:10px}
.tools{display:grid;grid-template-columns:repeat(2,48px);gap:8px;align-content:start}
.ibtn{width:48px;height:48px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:#fff;font-size:20px;cursor:pointer;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);display:grid;place-items:center;position:relative}
.ibtn:active{transform:scale(.93)}
.sdot{position:absolute;top:7px;right:7px;width:8px;height:8px;border-radius:50%;background:transparent}
.sdot.ok{background:#4ade80}.sdot.err{background:#f87171}
.left{grid-area:left;display:flex;flex-direction:column;gap:16px;min-height:0}
.clockcard{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.clock{font-size:clamp(70px,8.5vw,128px);font-weight:700;letter-spacing:-.045em;line-height:.92;font-variant-numeric:tabular-nums}
.clock small{font-size:.3em;color:var(--muted);font-weight:500;letter-spacing:0;margin-left:4px}
.sun{font-size:14px;color:var(--muted);text-align:right;line-height:1.7;white-space:nowrap}
.wx{flex:1;min-height:0;display:flex;flex-direction:column}
.wx>*{flex-shrink:0}
.wx-place{font-size:19px;font-weight:600;margin-top:6px;cursor:pointer;line-height:1.25}
.wx-now{display:flex;align-items:center;gap:14px;margin-top:8px}
.wx-ico{font-size:66px;line-height:1;filter:drop-shadow(0 8px 18px rgba(0,0,0,.25))}
.wx-temp{font-size:58px;font-weight:700;line-height:1;letter-spacing:-.03em}
.wx-desc{font-size:17px;font-weight:500}
.wx-meta{font-size:14px;color:var(--muted);margin-top:2px}
.na{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px;margin-top:12px}
.na .c{background:rgba(255,255,255,.09);border-radius:14px;padding:8px 10px;font-size:13px;color:var(--muted);line-height:1.25}
.na .c b{display:block;color:#fff;font-size:19px;font-weight:700}
.na .c.warn{background:rgba(251,146,60,.35)}
.xp{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin-top:8px;padding:9px 12px;border-radius:14px;background:rgba(255,255,255,.08);font-size:14px}
.xp .nm{font-weight:600;flex:1;min-width:0}
.xp .now{font-size:18px;font-weight:700;white-space:nowrap}
.xp .dd{display:flex;gap:12px;color:var(--muted);white-space:nowrap;width:100%;font-size:13px}
.tip{margin-top:12px;padding:10px 14px;border-radius:14px;background:rgba(255,255,255,.12);font-weight:500;font-size:15px}
.wx-hours{display:flex;gap:6px;overflow-x:auto;margin-top:12px;scrollbar-width:none;padding-bottom:2px}
.wx-hours::-webkit-scrollbar{display:none}
.wx-h{flex:0 0 auto;min-width:56px;text-align:center;padding:8px 4px;border-radius:14px;background:rgba(255,255,255,.08);font-size:14px}
.wx-h .i{font-size:22px;margin:3px 0}
.wx-h .p{font-size:11px;color:#9bd3ff}
.wx-days{display:grid;gap:6px;margin-top:12px}
.wx-dl{display:grid;grid-template-columns:52px 26px 30px 1fr 30px;align-items:center;gap:6px;font-size:14px}
.wx-dl .lo{color:var(--muted);text-align:right}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.14);position:relative}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,#7dd3fc,#fde68a,#fb923c)}
.agenda{grid-area:agenda;display:flex;flex-direction:column;min-height:0}
.agenda .list{overflow-y:auto;flex:1;margin:4px -8px 0;padding:0 8px;scrollbar-width:thin}
.day-h{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;font-weight:600;display:flex;gap:8px;align-items:center}
.day-h.today{color:var(--accent)}
.item{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:15px;background:rgba(255,255,255,.08);margin-bottom:6px;cursor:pointer}
.item.hol{background:rgba(255,255,255,.14)}
.item.bday{background:linear-gradient(90deg,rgba(244,114,182,.35),rgba(251,191,36,.25))}
.item .t{font-variant-numeric:tabular-nums;font-weight:600;min-width:46px;color:var(--accent);font-size:15px}
.item .e{font-size:22px;width:28px;text-align:center}
.item .ti{flex:1;font-weight:500;min-width:0}
.item .ti small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.dots{display:flex;gap:4px}.dots i{width:11px;height:11px;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.12)}
.empty{color:var(--muted);font-size:14px;padding:6px 2px}
.right{grid-area:right;display:flex;flex-direction:column;gap:16px;min-height:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:10px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);font-weight:600;padding-bottom:4px;text-transform:uppercase}
.cal .d{position:relative;height:38px;display:flex;align-items:center;justify-content:center;border-radius:12px;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums}
.cal .d:hover{background:rgba(255,255,255,.1)}
.cal .d.o{opacity:.32}.cal .d.red{color:#ffb4b4}
.cal .d.now{background:var(--accent);color:#1b1b2f;font-weight:700}
.cal .d .mk{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);display:flex;gap:2px}
.cal .d .mk i{width:4px;height:4px;border-radius:50%;background:#fff}
.cal .d.now .mk i{background:#1b1b2f}
.calnav{display:flex;gap:6px}
.calnav button{background:rgba(255,255,255,.1);border:0;color:#fff;width:30px;height:30px;border-radius:10px;cursor:pointer;font-size:15px}
.soon{display:grid;gap:8px;margin-top:10px}
.soon .s{display:flex;align-items:center;gap:12px}
.soon .s .e{font-size:24px;width:32px;text-align:center}
.soon .s .n{flex:1;font-weight:500}
.soon .s .c{font-weight:700;color:var(--accent);white-space:nowrap}
.week{grid-area:week;display:flex;flex-direction:column;min-height:0}
.mcal{flex:0 0 auto;margin-top:6px;gap:3px}.mcal .wd{padding-bottom:0}
.mcal .d{aspect-ratio:auto;height:28px;min-height:0;max-height:none;flex-direction:row;align-items:center;justify-content:flex-start;gap:6px;padding:0 8px;background:rgba(255,255,255,.05);text-align:left;border-radius:10px;font-size:14px;line-height:1.1}
.mcal .d .n{font-weight:600}
.mcal .d .em{font-size:12px;letter-spacing:1px;white-space:nowrap;overflow:hidden}
.mcal .d.now{background:var(--accent);color:#1b1b2f}
.mcal .d.inweek{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.wk{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:10px;margin-top:12px}
.wcol{display:flex;flex-direction:column;min-height:0;background:rgba(255,255,255,.06);border-radius:16px;padding:7px 7px 6px;border:1px solid rgba(255,255,255,.1)}
.wcol.today{background:rgba(255,255,255,.15);border:2px solid var(--accent)}
.wcol.past{opacity:.5}
.wh{text-align:center;cursor:pointer;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:6px;display:flex;gap:6px;justify-content:center;align-items:baseline;flex-wrap:wrap}
.wh .dn{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.wh .dd{font-size:20px;font-weight:700;line-height:1.1}
.wcol.today .dn,.wcol.today .dd{color:var(--accent)}
.wcol.red .dd{color:#ffb4b4}
.wh .hn{font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl{overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;scrollbar-width:none}
.wl::-webkit-scrollbar{display:none}
.wi{padding:6px 8px;border-radius:10px;background:rgba(255,255,255,.11);cursor:pointer;border-left:4px solid var(--c,rgba(255,255,255,.3));font-size:14px;line-height:1.25}
.wi:active{transform:scale(.97)}
.wi .tt{font-weight:700;color:var(--accent);font-size:13px;font-variant-numeric:tabular-nums}
.wi .ti{font-weight:500;display:block;word-break:break-word}
.wi small{color:var(--muted);display:block;font-size:12px;margin-top:1px}
.wi.bday{background:linear-gradient(135deg,rgba(244,114,182,.45),rgba(251,191,36,.3))}
.wi.hol{background:rgba(255,255,255,.2)}
.wi .dts{display:flex;gap:3px;margin-top:4px}.wi .dts i{width:8px;height:8px;border-radius:50%}
.wadd{margin-top:6px;border:1px dashed rgba(255,255,255,.25);background:none;color:var(--muted);border-radius:12px;padding:6px;font:inherit;font-size:13px;cursor:pointer;opacity:.7}
.wempty{color:var(--muted);font-size:13px;text-align:center;padding:10px 0;opacity:.7}
.soonrow{display:flex;gap:8px;overflow-x:auto;margin-top:12px;scrollbar-width:none;flex:0 0 auto}
.soonrow::-webkit-scrollbar{display:none}
.soonrow .s{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.1);font-size:14px;white-space:nowrap}
.soonrow .s b{color:var(--accent)}
@media (max-width:999px){.wk{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:4px}.wcol{flex:0 0 78%;scroll-snap-align:start}.wl{overflow:visible}}
.family{grid-area:family;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.mtile{cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);transition:transform .18s,background .3s;color:#fff;text-align:left;font:inherit;width:100%;min-width:0}
.mtile:hover{background:rgba(255,255,255,.2)}
.mtile:active{transform:scale(.97)}
.av{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:34px;flex:0 0 auto;box-shadow:0 0 0 3px rgba(255,255,255,.4),0 8px 20px rgba(0,0,0,.2)}
.av.big{width:84px;height:84px;font-size:46px}
.mtile .info{min-width:0;flex:1}
.mtile .n{font-weight:700;font-size:21px;line-height:1.1}
.mtile .s{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.mtile .bal{display:inline-block;margin-top:5px;font-weight:700;color:#1b1b2f;background:var(--accent);padding:2px 10px;border-radius:999px;font-size:14px}
.mtile.bd{animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}5%{transform:rotate(-2deg)}10%{transform:rotate(2deg)}15%{transform:rotate(0)}}
@media (min-width:1000px){
 #app{height:100vh;grid-template-columns:auto minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;grid-template-areas:"top top" "clockc wxc" "week week" "family family"}
 .left{display:contents}
 .clockcard{grid-area:clockc;flex-direction:column;align-items:flex-start;justify-content:center;min-width:360px}
 .clockcard .sun{text-align:left;display:flex;gap:16px}
 .wx{grid-area:wxc;display:grid;grid-template-columns:auto minmax(0,1.1fr) minmax(190px,.8fr);gap:8px 22px;align-items:start;overflow:hidden}
 .wx>.wx-head{grid-column:1/-1;margin-bottom:-4px}
 .wx .wx-a .tip{margin-top:10px}
 .wx .wx-b .na{margin-top:0;grid-template-columns:repeat(3,minmax(0,1fr))}
 .wx .wx-b .na .c{padding:6px 9px}.wx .wx-b .na .c b{font-size:17px}
 .top{flex-wrap:nowrap}.greet{flex:1 1 200px}
 .clockcard .clock{font-size:clamp(70px,7vw,112px)}
 .wx .wx-c .wx-days{margin-top:0;gap:4px}
 .wx .wx-d{display:none}
 .wx .xp{margin-top:6px}
 .week{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.7fr);grid-template-rows:auto minmax(0,1fr) auto;column-gap:22px}
 .mhead{grid-column:1;grid-row:1}.mcal{grid-column:1;grid-row:2;align-self:start;margin-top:10px}.whead{grid-column:2;grid-row:1;margin-top:0!important}.week .wk{grid-column:2;grid-row:2;margin-top:10px}.week .soonrow{grid-column:1/-1;grid-row:3}
 .mcal .d{height:clamp(20px,3vh,28px)}
 .mcal{grid-template-columns:repeat(7,minmax(0,1fr))}.mcal .d{overflow:hidden;white-space:nowrap;padding:0 6px}
 .week .wk{min-height:0;overflow:hidden}.week .wcol{overflow:hidden}.week .wl{min-height:0;overflow-y:auto;scrollbar-width:none}
 .wx .wx-b{min-width:0;overflow:hidden}
 .top .hist .txt{-webkit-line-clamp:2}.top .hist .yr{font-size:26px}.hist h3,.hist .ttl{white-space:nowrap}
 }
@media (min-width:1000px) and (max-height:1100px){
 #app{gap:10px;padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
 .card{padding:10px 14px}
 .top{gap:10px}.top>.card{padding:8px 12px}
 .greet .fam{font-size:11px}.greet h1{font-size:26px}.greet .date{font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
 .music{padding:8px 10px}.music .art,.music img{width:40px;height:40px}
 .hist .body{margin-top:4px}.hist .txt{font-size:13.5px;line-height:1.3;display:block;-webkit-line-clamp:unset;max-height:2.6em}
 .hist .yr{font-size:20px}.lbl{font-size:10.5px}
 .tools{gap:6px}.tools .ib,.tools button{width:36px;height:36px}
 .clockcard{min-width:250px}.clockcard .clock{font-size:clamp(54px,5.4vw,74px)}.sun{font-size:12.5px;line-height:1.5}.clockcard .sun{gap:10px}
 .wx{gap:4px 16px}.wx>.wx-head{margin-bottom:-2px}
 .wx-now{margin-top:2px;gap:10px}.wx-ico{font-size:40px}.wx-temp{font-size:38px}.wx-desc{font-size:14px}.wx-meta{font-size:12px}

<script>
'use strict';
/* ============ Hjelpere ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const pad=n=>String(n).padStart(2,'0');
const DAYS=['sundag','måndag','tysdag','onsdag','torsdag','fredag','laurdag'];
const DSHORT=['sun','mån','tys','ons','tor','fre','lau'];
const MONTHS=['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const sod=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const dayDiff=(a,b)=>Math.round((sod(b)-sod(a))/864e5);
const kr=n=>`${Math.round(n).toLocaleString('nb-NO')} kr`;
const hm=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ============ Data ============ */
const COLLS=['members','chores','logs','payouts','events','trainings','tasks','shop'];
function defaults(){
  const S={settings:{familyName:'Familien vår',place:'Kringla 21, Sogndal',lat:61.2297,lon:7.1005,pin:'1234',nightFrom:'21:30',nightTo:'06:30',gcal:'',places2:[],netatmo:{},gcalIds:'',gkey:'',spClient:'',spPlaylists:[]}};
  COLLS.forEach(c=>S[c]={});
  const add=(c,o)=>{const id=uid();S[c][id]={...o,id};return id};
  add('members',{name:'Mamma',emoji:'👩',color:'#f472b6',kid:false,birthday:'1985-11-20',order:1});
  add('members',{name:'Pappa',emoji:'👨',color:'#60a5fa',kid:false,birthday:'1982-07-17',order:2});
  const e=add('members',{name:'Live',emoji:'👧',color:'#fbbf24',kid:true,birthday:'2013-04-12',order:3});
  const j=add('members',{name:'Ada',emoji:'👧',color:'#34d399',kid:true,birthday:'2015-08-19',order:4});
  [['Tømme oppvaskmaskina','🍽️',15],['Vaske trappa','🧽',30],['Rydde rommet','🧸',20],['Støvsuge','🧹',25],['Bere ut bosset','🗑️',10],['Dekke på bordet','🍴',10],['Brette klede','👕',15],['Måke snø','❄️',40],['Vaske bilen','🚗',50],['Lufte hunden','🐕',15]]
    .forEach(([name,emoji,price],i)=>add('chores',{name,emoji,price,order:i}));
  return S;
}
let S=LS.get('fam_state',null);
let firstRun=!S;
if(!S)S=defaults();
COLLS.forEach(c=>{if(!S[c])S[c]={}});
S.settings={...defaults().settings,...(S.settings||{})};
const L=Object.assign({syncUrl:'',mode:'auto',theme:'auto',anim:true,restMin:5,style:'black'},LS.get('fam_local',{}));
const persist=()=>LS.set('fam_state',S);
/* Innebygd kopling: alle einingar som opnar sidan koplast til same Google-skript (felles data + kalender) */
const BUILTIN={gasUrl:'https://script.google.com/macros/s/AKfycbwzmZw4hctbmt9jtuVe_ypZO7a5LJGTFEMGaK6RgVjg_sHGqcqxSSZr3dSCagfPZXYS/exec',gasKey:'mwl6cehpgwh754mwl6cehp2gdugvmwl6cehp1f1imh'};
if(BUILTIN.gasUrl&&S.settings.gasUrl!==BUILTIN.gasUrl){S.settings.gasUrl=BUILTIN.gasUrl;S.settings.gasKey=BUILTIN.gasKey}
if(!S.settings.mig3){const EX=[['Fotball',2,'17:30'],['Fotball',4,'17:30'],['Turn',1,'18:00'],['Pianotime',3,'16:00']];
  Object.values(S.trainings).forEach(t=>{if(!t.gid&&EX.some(([n,w,tm])=>t.title===n&&+t.weekday===w&&t.time===tm))delete S.trainings[t.id]});
  Object.values(S.tasks).forEach(t=>{if(t.title==='Lese 20 minutter')delete S.tasks[t.id]});S.settings.mig3=true}
if(!S.settings.mig4){const CN={'Tømme oppvaskmaskinen':'Tømme oppvaskmaskina','Bære ut søppel':'Bere ut bosset','Brette klær':'Brette klede'};
  Object.values(S.chores).forEach(c=>{if(CN[c.name])c.name=CN[c.name]});S.settings.mig4=true}
if(!S.settings.renamed1){Object.values(S.members).forEach(m=>{if(m.name==='Emma')m.name='Live';if(m.name==='Jonas'){m.name='Ada';if(m.emoji==='👦')m.emoji='👧'}});S.settings.renamed1=true}
if(!S.settings.mig2){const B={Mamma:'1985-11-20',Pappa:'1982-07-17',Live:'2013-04-12',Ada:'2015-08-19'};
  Object.values(S.members).forEach(m=>{if(B[m.name]&&!m.birthday)m.birthday=B[m.name]});
  if(S.settings.place==='Oslo'&&Math.abs(S.settings.lat-59.9139)<.001){Object.assign(S.settings,{place:'Kringla 21, Sogndal',lat:61.2297,lon:7.1005})}
  S.settings.places2=(S.settings.places2||[]).filter(p=>p.id!=='sogndal');S.settings.mig2=true}
const persistL=()=>LS.set('fam_local',L);
const UI_KEYS={style:'black',theme:'auto',weekend:false,anim:true};
Object.keys(UI_KEYS).forEach(k=>{const local=L[k];delete L[k];Object.defineProperty(L,k,{enumerable:false,configurable:true,
  get(){const u=S.settings.ui||{};return k in u?u[k]:(local!==undefined?local:UI_KEYS[k])},
  set(v){S.settings.ui={...(S.settings.ui||{}),[k]:v}}})});
persist();

const members=()=>Object.values(S.members).sort((a,b)=>(a.order||0)-(b.order||0)||a.name.localeCompare(b.name));
const chores=()=>Object.values(S.chores).sort((a,b)=>(a.order||0)-(b.order||0));

/* ============ Synk (Firebase Realtime Database, valfritt) ============ */
const Sync={rev:null,
  gas(){return !!(S.settings.gasUrl&&S.settings.gasKey)},
  base(){if(this.gas())return 'gas';const u=(L.syncUrl||'').trim().replace(/\/+$/,'').replace(/\.json$/,'');return u?u+'/familie':''},
  status(s){const d=$('#sdot');if(d)d.className='sdot '+(this.base()?s:'')},
  async put(path,val){const b=this.base();if(!b)return;
    if(b==='gas'){try{const j=await gasCall({action:'put',path,value:val});if(j&&j.rev!=null&&this.rev!=null&&j.rev===this.rev+1)this.rev=j.rev;this.status('ok')}catch(e){this.status('err')}return}
    try{const r=await fetch(`${b}/${path}.json`,val===null?{method:'DELETE'}:{method:'PUT',body:JSON.stringify(val)});if(!r.ok)throw r.status;this.status('ok')}catch(e){this.status('err')}},
  pull(){if(this._p)return this._p;this._p=this._pull().finally(()=>{this._p=null});return this._p},
  async _pull(){const b=this.base();if(!b)return false;
    if(b==='gas'){try{const j=await gasCall({action:'get',rev:this.rev});if(j.same){this.status('ok');return true}
        const d=j.state;this.rev=j.rev;
        if(!d||!d.members||!Object.keys(d.members).length){await this.pushAll();return true}
        const keepUrl=S.settings.gasUrl,keepKey=S.settings.gasKey,first=!LS.get('fam_gas_synced',false),pushes=[];
        const empty=v=>v==null||v===''||(Array.isArray(v)&&!v.length)||(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length);
        if(d.settings){const loc=S.settings;let dirty=false;const merged={...loc,...d.settings};
          if(first){for(const k of Object.keys(loc)){if(empty(d.settings[k])&&!empty(loc[k])){merged[k]=loc[k];dirty=true}
            if(k==='netatmo'&&!empty(loc.netatmo)&&loc.netatmo.refresh&&!(d.settings.netatmo||{}).refresh){merged.netatmo=loc.netatmo;dirty=true}}}
          S.settings=merged;if(dirty)pushes.push(['settings',merged])}
        S.settings.gasUrl=keepUrl;S.settings.gasKey=keepKey;
        COLLS.forEach(c=>{const srv=d[c]||{};
          if(first&&['logs','payouts','events','trainings','tasks','shop'].includes(c)){Object.values(S[c]||{}).forEach(it=>{if(it&&it.id&&!srv[it.id]){srv[it.id]=it;pushes.push([c+'/'+it.id,it])}})}
          S[c]=srv});
        persist();LS.set('fam_gas_synced',true);
        for(const [path,v] of pushes)await this.put(path,v);
        this.status('ok');softRender();return true}
      catch(e){this.status('err');return false}}
    try{const r=await fetch(`${b}.json`,{cache:'no-store'});if(!r.ok)throw r.status;const d=await r.json();
      if(!d){await this.pushAll();return true}
      if(d.settings)S.settings={...S.settings,...d.settings};
      COLLS.forEach(c=>{S[c]=d[c]||{}});persist();this.status('ok');softRender();return true}
    catch(e){this.status('err');return false}},
  async pushAll(){const b=this.base();if(!b)return;
    if(b==='gas'){try{const j=await gasCall({action:'putall',state:S});if(j&&j.rev!=null)this.rev=j.rev;this.status('ok')}catch(e){this.status('err')}return}
    try{const r=await fetch(`${b}.json`,{method:'PUT',body:JSON.stringify(S)});this.status(r.ok?'ok':'err')}catch(e){this.status('err')}}
};
function save(c,obj){S[c][obj.id]=obj;persist();Sync.put(`${c}/${obj.id}`,obj);render()}
function remove(c,id){delete S[c][id];persist();Sync.put(`${c}/${id}`,null);render()}
function saveSettings(){persist();Sync.put('settings',S.settings);render()}

/* ============ Merkedager ============ */
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function nthSunday(y,mo,n){const d=new Date(y,mo,1);return new Date(y,mo,1+(7-d.getDay())%7+7*(n-1))}
const holCache={};
function holidays(y){
  if(holCache[y])return holCache[y];
  const E=easter(y),list=[],F=(m,d)=>new Date(y,m-1,d);
  const add=(d,name,emoji,red,soon)=>list.push({date:ymd(d),name,emoji,red:!!red,soon:!!soon});
  add(F(1,1),'Første nyttårsdag','🎆',1);
  add(nthSunday(y,1,2),'Morsdag','💐',0,1);
  add(F(2,14),'Valentinsdag','💝');
  add(addDays(E,-49),'Fastelavnssundag','🎭');
  add(addDays(E,-7),'Palmesundag','🌿',1);
  add(addDays(E,-3),'Skjærtorsdag','🐣',1);
  add(addDays(E,-2),'Langfredag','✝️',1);
  add(addDays(E,-1),'Påskeaftan','🥚',0,1);
  add(E,'1. påskedag','🐣',1);add(addDays(E,1),'2. påskedag','🐣',1);
  add(F(5,1),'Arbeidarane sin dag','🚩',1);add(F(5,8),'Frigjøringsdagen','🇳🇴');
  add(F(5,17),'17. mai – Grunnlovsdagen','🇳🇴',1,1);
  add(addDays(E,39),'Kristi himmelfartsdag','☁️',1);
  add(addDays(E,49),'1. pinsedag','🕊️',1);add(addDays(E,50),'2. pinsedag','🕊️',1);
  add(F(6,23),'Sankthansaftan','🔥',0,1);
  add(F(10,31),'Halloween','🎃',0,1);
  add(nthSunday(y,10,2),'Farsdag','👔',0,1);
  const x=F(12,25),a4=addDays(x,-(x.getDay()||7));
  for(let i=0;i<4;i++)add(addDays(a4,-7*(3-i)),`${i+1}. sundag i advent`,'🕯️',1);
  add(F(12,13),'Luciadagen','👑');
  add(F(12,24),'Julaftan','🎄',0,1);add(F(12,25),'1. juledag','🎄',1);add(F(12,26),'2. juledag','🎄',1);
  add(F(12,31),'Nyttårsaftan','🎆',0,1);
  return holCache[y]=list;
}
const holidayOn=d=>holidays(d.getFullYear()).filter(h=>h.date===ymd(d));

/* ============ Kalenderlogikk ============ */
function itemsForDay(d){
  const ds=ymd(d),md=ds.slice(5),dow=d.getDay(),out=[];
  holidayOn(d).forEach(h=>out.push({kind:'hol',emoji:h.emoji,title:h.name,red:h.red}));
  (S.settings.bdays||[]).forEach(b=>{if(b.date&&b.date.slice(5)===md){const age=d.getFullYear()-(+b.date.slice(0,4));out.push({kind:'bday',emoji:'🎈',title:`${b.name}${age>0&&age<130?` fyller ${age}`:' har bursdag'}`,members:[]})}});
  members().forEach(m=>{if(m.birthday&&m.birthday.slice(5)===md){const age=d.getFullYear()-(+m.birthday.slice(0,4));out.push({kind:'bday',emoji:'🎂',title:`${m.name} har bursdag${age>0&&age<130?` – fyller ${age}!`:''}`,members:[m.id]})}});
  Object.values(S.events).forEach(e=>{if(!e.date)return;
    const len=e.dateEnd&&e.dateEnd>e.date?Math.round((parseYmd(e.dateEnd)-parseYmd(e.date))/864e5):0;
    const starts=s=>{const sd=ymd(s);return sd===e.date||(e.repeat==='weekly'&&sd>e.date&&parseYmd(e.date).getDay()===s.getDay())||(e.repeat==='yearly'&&sd>e.date&&e.date.slice(5)===sd.slice(5))};
    for(let k=0;k<=len;k++){if(!starts(addDays(d,-k)))continue;
      const first=k===0,last=k===len,span=len?` <span class="span">${first?'start':last?'slutt':'dag '+(k+1)}/${len+1}</span>`:'';
      out.push({kind:'event',id:e.id,time:first?(e.time||''):'',endTime:last&&e.time&&e.timeEnd?e.timeEnd:'',endOnly:!first&&last&&e.timeEnd?e.timeEnd:'',title:e.title,span,emoji:e.emoji||'📅',members:e.members||[],note:e.note||''});break}});
  Object.values(S.trainings).forEach(t=>{if(+t.weekday===dow&&S.members[t.member])out.push({kind:'train',id:t.id,time:t.time||'',endTime:t.time&&t.timeEnd||'',title:t.title,emoji:t.emoji||'🏃',note:t.place||'',members:[t.member]})});
  GC.events.forEach(g=>{if(g.startDate<=ds&&ds<=g.endDate){const first=g.startDate===ds;
    out.push({kind:'gcal',id:g.id,time:g.allDay||!first?'':g.time,endTime:g.allDay||!first||g.endDate!==ds?'':g.endTime,title:g.title,emoji:g.emoji,note:g.location,members:g.members})}});
  GAS.events.forEach(g=>{if(g.fam&&(S.events[g.fam]||S.trainings[g.fam]))return;if(g.startDate<=ds&&ds<=g.endDate){const first=g.startDate===ds;
    out.push({kind:'gcal',id:g.id,time:g.allDay||!first?'':g.time,endTime:g.allDay||!first||g.endDate!==ds?'':g.endTime,title:g.title,emoji:g.emoji,note:[g.location,(g.calId&&g.calId===S.settings.gasWriteCal)||(S.settings.gasCals||[]).length===1?'':g.cal].filter(Boolean).join(' · '),members:g.members})}});
  return out.sort((a,b)=>(a.time?1:0)-(b.time?1:0)||(a.time||'').localeCompare(b.time||''));
}
function dotsFor(ids){return `<span class="dots">${(ids||[]).map(id=>S.members[id]).filter(Boolean).map(m=>`<i style="background:${esc(m.color)}" title="${esc(m.name)}"></i>`).join('')}</span>`}
function whoNames(ids){return (ids||[]).map(id=>S.members[id]?.name).filter(Boolean).join(', ')}
function itemHtml(it,showWho){
  const click=it.kind==='event'?`App.editEvent('${it.id}')`:it.kind==='train'?`App.editTraining('${it.id}')`:it.kind==='gcal'?`App.gEvent('${esc(it.id)}')`:'';
  const sub=[it.note,showWho?whoNames(it.members):''].filter(Boolean).join(' · ');
  return `<div class="item ${it.kind}" ${click?`onclick="${click}"`:''}>
    <span class="t">${esc(it.time||'')}${it.endTime?'<small style="display:block;font-weight:500;opacity:.75">–'+esc(it.endTime)+'</small>':''}</span><span class="e">${it.emoji}</span>
    <span class="ti">${esc(it.title)}${sub?`<small>${esc(sub)}</small>`:''}</span>${dotsFor(it.members)}</div>`;
}

  paske:{c:['#ab7b00','#669a35','#4789c4'],acc:'#fff6b0',fx:[['petal',2]],petal:['#fff7b0','#ffe066','#ffffff'],name:'Påske'},
  sankthans:{c:['#19234b','#66204b','#d95e09'],acc:'#ffd08a',fx:[['spark',4]],name:'Sankthans'}
};
function themeFor(d){
  const md=`${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const b=members().filter(m=>m.birthday&&m.birthday.slice(5)===md);
  if(b.length||(S.settings.bdays||[]).some(x=>x.party&&x.date&&x.date.slice(5)===md))return{key:'birthday',people:b};
  if(md==='05-17')return{key:'mai17'};
  if(md==='12-31'||md==='01-01')return{key:'nyttar'};
  if(md>='12-24'&&md<='12-26')return{key:'jul'};
  if(md>='12-01')return{key:'advent'};
  if(md==='10-31')return{key:'halloween'};
  if(md==='06-23')return{key:'sankthans'};
  const diff=dayDiff(easter(d.getFullYear()),d);if(diff>=-7&&diff<=1)return{key:'paske'};
  const m=d.getMonth();return{key:m<=1||m===11?'winter':m<=4?'spring':m<=7?'summer':'autumn'};
}
function isNight(now=new Date()){
  if(L.mode==='day')return false;if(L.mode==='night')return true;
  const t=hm(now),a=S.settings.nightFrom||'21:30',b=S.settings.nightTo||'06:30';
  return a>b?(t>=a||t<b):(t>=a&&t<b);
}
let curTheme=null;
function applyTheme(){
  const now=new Date(),auto=themeFor(now);
  const th=L.theme&&L.theme!=='auto'&&THEMES[L.theme]?{key:L.theme,people:auto.people}:auto;
  curTheme=th;const T=THEMES[th.key],night=isNight(now);
  const r=document.documentElement.style;
  r.setProperty('--bg1',T.c[0]);r.setProperty('--bg2',T.c[1]);r.setProperty('--bg3',T.c[2]);r.setProperty('--accent',T.acc);
  document.body.dataset.theme=th.key;document.body.dataset.mode=night?'night':'day';document.body.dataset.style=L.style||'black';
  document.querySelector('meta[name=theme-color]').content=night?'#080b1c':T.c[0];
  $('#modeBtn').textContent=L.mode==='auto'?'🌗':L.mode==='day'?'☀️':'🌙';
  // værstyrte effekter i vanlege årstider
  let fx=T.fx,sc=WX.cur?.symbol||'';
  if(['winter','spring','summer','autumn'].includes(th.key)){
    if(/snow|sleet/.test(sc))fx=[['snow',9]];
    else if(/rain/.test(sc))fx=th.key==='autumn'?[['rain',5],['leaf',.6]]:[['rain',5]];
  }
  FX.cfg=T;
  const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  FX.set(fx,night,!L.anim||reduce);
}

const FX={ps:[],stars:[],kinds:[],count:{},t:0,cfg:{},
  init(){this.c=$('#fx');this.g=this.c.getContext('2d');this.resize();addEventListener('resize',()=>this.resize());requestAnimationFrame(t=>this.loop(t))},
  resize(){const d=Math.min(devicePixelRatio||1,2);this.w=innerWidth;this.h=innerHeight;this.c.width=this.w*d;this.c.height=this.h*d;this.g.setTransform(d,0,0,d,0,0)},
  set(kinds,night,off){const key=JSON.stringify(kinds)+night+off+this.cfg.name;if(key===this.key)return;this.key=key;
    this.kinds=off?[]:kinds;this.night=night;const ks=this.kinds.map(k=>k[0]);
    this.ps=this.ps.filter(p=>ks.includes(p.k)||(p.k==='boom'&&ks.includes('rocket')));
    this.stars=night&&!off?Array.from({length:160},()=>({x:Math.random(),y:Math.random()*.8,r:Math.random()*1.4+.3,p:Math.random()*6.28,s:.4+Math.random()*1.4})):[];
    for(const[k,d]of this.kinds){if(k==='rocket')continue;const n=Math.round(this.target(d)*.8);for(let i=0;i<n;i++)this.spawn(k,true)}},
  target(d){return Math.round(d*this.w*this.h/100000*(this.night?.55:1))},
  spawn(k,init){const W=this.w,H=this.h,R=Math.random,C=this.cfg;
    const p={k,x:R()*W,y:init?R()*H:-30,rot:R()*6.28,vr:(R()-.5)*.04,ph:R()*6.28,a:1,vx:0,vy:1,r:4};
    switch(k){
      case'snow':p.r=1+R()*3;p.vy=.3+p.r*.28;p.vx=(R()-.5)*.3;p.a=.45+R()*.5;break;
      case'rain':p.vy=10+R()*6;p.vx=-1.6;p.l=10+R()*16;p.a=.2+R()*.3;break;
      case'petal':p.r=4+R()*4;p.vy=.5+R()*.8;p.vx=.3+R()*.6;p.col=pick(C.petal||['#ffd1dc','#ffb7c9','#fff0f5','#ffe39a','#ffffff']);break;
      case'leaf':p.r=7+R()*8;p.vy=.6+R()*.9;p.vx=(R()-.5)*.6;p.col=pick(['#e8743b','#d9480f','#f2a541','#c0392b','#f6c344','#a0522d']);break;
      case'bokeh':p.r=10+R()*42;p.y=init?R()*H:H+60;p.vy=-(.1+R()*.3);p.vx=(R()-.5)*.2;p.col=pick(C.bokeh||['255,230,160','255,255,255','255,200,120']);p.a=.07+R()*.17;break;
      case'confetti':p.r=5+R()*6;p.vy=1+R()*1.8;p.vx=(R()-.5);p.col=pick(C.conf||['#f43f5e','#fbbf24','#34d399','#60a5fa','#a78bfa','#f472b6']);p.vr=(R()-.5)*.2;break;
      case'flag':p.r=16+R()*12;p.vy=.8+R();p.vx=(R()-.5)*.6;p.vr=(R()-.5)*.03;break;
      case'balloon':p.r=18+R()*16;p.y=init?H*.2+R()*H:H+70;p.vy=-(.5+R()*.8);p.col=pick(['#f43f5e','#fbbf24','#34d399','#60a5fa','#a78bfa','#f472b6','#fb923c']);break;
      case'spark':p.r=1+R()*2.5;p.y=init?R()*H:H+10;p.vy=-(1+R()*2);p.vx=(R()-.5)*.8;p.col=pick(['255,180,60','255,120,30','255,220,120']);break;
      case'bat':p.r=10+R()*10;p.dir=R()<.5?1:-1;p.x=p.dir>0?-40:W+40;p.y=R()*H*.6;p.vx=(1+R()*1.5)*p.dir;p.vy=0;break;
      case'rocket':p.x=W*(.15+R()*.7);p.y=H+10;p.vy=-(7+R()*4)*(H/900);p.vx=(R()-.5)*1.5;p.col=pick(['255,90,90','255,210,80','120,200,255','190,130,255','120,255,170','255,255,255']);p.ty=H*(.12+R()*.35);break;
    }

  boom(x,y,col){for(let i=0;i<70;i++){const a=Math.random()*6.28,s=1+Math.random()*4;this.ps.push({k:'boom',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,col,r:1.6})}},
  loop(ts){requestAnimationFrame(t=>this.loop(t));if(document.hidden)return;

  draw(p){const g=this.g;g.save();g.globalAlpha=p.a??1;

      case'rain':g.strokeStyle='rgba(210,230,255,1)';g.lineWidth=1.2;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x+p.vx*1.6,p.y+p.l);g.stroke();break;
      case'petal':g.translate(p.x,p.y);g.rotate(p.rot);g.scale(1,Math.abs(Math.cos(p.ph*2))*.6+.4);g.fillStyle=p.col;g.globalAlpha=.85;g.beginPath();g.ellipse(0,0,p.r,p.r*.55,0,0,6.28);g.fill();break;
      case'leaf':{g.translate(p.x,p.y);g.rotate(p.rot);g.scale(Math.cos(p.ph*1.5)*.5+.6,1);const r=p.r;g.fillStyle=p.col;g.globalAlpha=.9;g.beginPath();g.moveTo(0,-r);g.quadraticCurveTo(r*.9,-r*.2,0,r);g.quadraticCurveTo(-r*.9,-r*.2,0,-r);g.fill();g.strokeStyle='rgba(80,30,10,.5)';g.lineWidth=1;g.beginPath();g.moveTo(0,-r*.8);g.lineTo(0,r*1.25);g.stroke();break}
      case'bokeh':{const gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);const a=p.a*(.7+.3*Math.sin(p.ph*2));gr.addColorStop(0,`rgba(${p.col},${a})`);gr.addColorStop(1,`rgba(${p.col},0)`);g.fillStyle=gr;g.beginPath();g.arc(p.x,p.y,p.r,0,6.28);g.fill();break}
      case'confetti':g.translate(p.x,p.y);g.rotate(p.rot);g.scale(1,Math.cos(p.ph*4));g.fillStyle=p.col;g.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);break;
      case'flag':{g.translate(p.x,p.y);g.rotate(p.rot+Math.sin(p.ph)*.2);g.scale(Math.cos(p.ph*2)*.25+.75,1);const w=p.r,h=w*16/22,x0=-w/2,y0=-h/2;
        g.fillStyle='#ba0c2f';g.fillRect(x0,y0,w,h);g.fillStyle='#fff';g.fillRect(x0+w*6/22,y0,w*4/22,h);g.fillRect(x0,y0+h*6/16,w,h*4/16);
        g.fillStyle='#00205b';g.fillRect(x0+w*7/22,y0,w*2/22,h);g.fillRect(x0,y0+h*7/16,w,h*2/16);
        g.strokeStyle='rgba(255,255,255,.7)';g.lineWidth=1.2;g.beginPath();g.moveTo(x0,y0);g.lineTo(x0,y0+h*2.2);g.stroke();break}
      case'balloon':{const x=p.x+Math.sin(p.ph*1.3)*8,r=p.r;g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=1;g.beginPath();g.moveTo(x,p.y+r*1.15);g.quadraticCurveTo(x+Math.sin(p.ph*2)*8,p.y+r*2,x,p.y+r*2.9);g.stroke();

function moonPhaseDeg(d){const syn=29.530588853,ref=Date.UTC(2000,0,6,18,14);const age=(((d.getTime()-ref)/864e5)%syn+syn)%syn;return age/syn*360}

  const d=new Date(),{lat,lon}=S.settings,off=-d.getTimezoneOffset(),o=`${off>=0?'+':'-'}${pad(Math.floor(Math.abs(off)/60))}:${pad(Math.abs(off)%60)}`;

    c={key,up:j.properties?.sunrise?.time||null,down:j.properties?.sunset?.time||null};LS.set('fam_sun',c)}catch(e){c=null}}

    m={key,up:j.properties?.moonrise?.time||null,down:j.properties?.moonset?.time||null,phase:j.properties?.moonphase??null};LS.set('fam_moon',m)}catch(e){m=null}}

const NA={out:null,in:null,rooms:[],rain:null,wind:null,co2:0,err:'',t:0};
function naCfg(){return S.settings.netatmo||(S.settings.netatmo={})}
async function naToken(force){
  if(Sync.base())await Sync.pull();
  const n=naCfg();if(!n.cid||!n.secret||!n.refresh)return null;
  if(!force&&n.access&&n.exp>Date.now()+120e3)return n.access;
  const body=new URLSearchParams({grant_type:'refresh_token',refresh_token:n.refresh,client_id:n.cid,client_secret:n.secret});
  const r=await fetch('https://api.netatmo.com/oauth2/token',{method:'POST',body});const j=await r.json();
  if(!j.access_token)throw new Error(j.error==='invalid_grant'?'Refresh-token er ugyldig – lag nytt token på dev.netatmo.com':(j.error||'Innlogging feila'));
  S.settings.netatmo={...n,access:j.access_token,refresh:j.refresh_token||n.refresh,exp:Date.now()+(j.expires_in||10800)*1000};
  persist();Sync.put('settings',S.settings);return j.access_token;
}
async function loadNetatmo(){
  const n=naCfg();if(!n.cid||!n.refresh){NA.out=NA.in=null;NA.co2=0;return}
  try{let t=await naToken();if(!t)return;
    const get=tok=>fetch('https://api.netatmo.com/api/getstationsdata?access_token='+encodeURIComponent(tok)).then(r=>r.json());
    let j=await get(t);if(j.error){t=await naToken(true);j=await get(t)}
    if(j.error)throw new Error(j.error.message||'Feil frå Netatmo');
    const dev=j.body?.devices?.[0];if(!dev)throw new Error('Fann ingen vêrstasjon på kontoen');
    NA.in={...(dev.dashboard_data||{}),name:dev.module_name||'Inne'};NA.out=null;NA.rain=null;NA.wind=null;NA.rooms=[];
    (dev.modules||[]).forEach(m=>{const d=m.dashboard_data;if(!d)return;
      if(m.type==='NAModule1')NA.out=d;else if(m.type==='NAModule3')NA.rain=d;else if(m.type==='NAModule2')NA.wind=d;else if(m.type==='NAModule4')NA.rooms.push({...d,name:m.module_name})});
    NA.co2=Math.max(NA.in.CO2||0,...NA.rooms.map(r=>r.CO2||0));NA.err='';NA.t=Date.now();
  }catch(e){NA.err=e.message||'Fekk ikkje kontakt med Netatmo';}
  renderWeather();applyTheme();
}
function naHtml(){
  if(!NA.in&&!NA.out)return NA.err&&naCfg().cid?`<div class="hint">🏠 Netatmo: ${esc(NA.err)}</div>`:'';
  const tr=t=>t==='up'?' ↗':t==='down'?' ↘':'';const f=v=>v==null?'–':(+v).toFixed(1).replace('.',',');const c=[];
  if(NA.out)c.push(`<div class="c">Ute${tr(NA.out.temp_trend)}<b>${f(NA.out.Temperature)}°</b>${NA.out.min_temp!=null?`${f(NA.out.min_temp)}° / ${f(NA.out.max_temp)}°`:''}</div>`);
  if(NA.in)c.push(`<div class="c">${esc(NA.in.name)}<b>${f(NA.in.Temperature)}°</b>${NA.in.Humidity??'–'} % fukt</div>`);
  if(NA.in?.CO2!=null)c.push(`<div class="c ${NA.in.CO2>1000?'warn':''}">CO₂ inne<b>${NA.in.CO2}</b>ppm</div>`);
  NA.rooms.forEach(r=>c.push(`<div class="c ${r.CO2>1000?'warn':''}">${esc(r.name)}<b>${f(r.Temperature)}°</b>${r.CO2!=null?r.CO2+' ppm':''}</div>`));
  if(NA.rain)c.push(`<div class="c">Regn i dag<b>${f(NA.rain.sum_rain_24)}</b>mm</div>`);
  if(NA.wind)c.push(`<div class="c">Vind<b>${Math.round((NA.wind.WindStrength||0)/3.6)}</b>m/s (kast ${Math.round((NA.wind.GustStrength||0)/3.6)})</div>`);

  return `<div class="na">${c.join('')}</div>`;
}

const spRedirect=()=>location.origin+location.pathname;

async function spLogin(){const cid=(S.settings.spClient||'').trim();if(!cid)return toast('Legg inn Client ID først');

  try{const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',body:new URLSearchParams({grant_type:'authorization_code',code,redirect_uri:spRedirect(),client_id:S.settings.spClient,code_verifier:LS.get('fam_sp_v','')})});

/* ============ Google Kalender toveis (Apps Script) ============ */
const GAS_CODE="// Familieskjermen <-> Google Kalender + felles data for alle skjermer\n// Ikke del denne koden eller nettapp-adressen med andre.\nconst NOKKEL = '%KEY%';\n// Kalendere som skal vises p\u00e5 skjermen. Den F\u00d8RSTE er der nye avtaler fra skjermen lagres.\n// 'primary' = hovedkalenderen din. Legg til flere med kalender-ID, f.eks. Spond-kalenderen:\n// const KALENDERE = ['primary', 'abc123@group.calendar.google.com'];\nconst KALENDERE = ['primary'];\n\nfunction doGet(e) { var q = (e && e.parameter) || {}; if (q.code && q.state) return sonosTilbake(q); return svar(behandle(q)); }\nfunction doPost(e) { var p = {}; try { p = JSON.parse(e.postData.contents); } catch (err) {} return svar(behandle(p)); }\nfunction svar(o) { return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }\nfunction kal(id) { return (!id || id === 'primary') ? CalendarApp.getDefaultCalendar() : CalendarApp.getCalendarById(id); }\nfunction standardKalendere() {\n  return CalendarApp.getAllCalendars().filter(function (c) { var id = c.getId(); return !/#holiday@|#contacts@|addressbook#|#weeknum@/.test(id); }).map(function (c) { return c.getId(); });\n}\nfunction dato(s) { if (/^\\d{4}-\\d{2}-\\d{2}$/.test(s)) { var a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); } return new Date(s); }\n\n// ---- Felles lagring for alle skjermer (familiedata) ----\nvar P = PropertiesService.getScriptProperties();\nvar SAMLINGER = ['settings', 'members', 'chores', 'logs', 'payouts', 'events', 'trainings', 'tasks', 'shop'];\nfunction les(navn) {\n  var n = +(P.getProperty('s_' + navn + '_n') || 0); if (!n) return null;\n  var s = ''; for (var i = 0; i < n; i++) s += P.getProperty('s_' + navn + '_' + i) || '';\n  try { return JSON.parse(s); } catch (e) { return null; }\n}\nfunction skriv(navn, obj) {\n  var s = JSON.stringify(obj || {}), deler = [], gammel = +(P.getProperty('s_' + navn + '_n') || 0), props = {};\n  for (var i = 0; i < s.length; i += 3500) deler.push(s.slice(i, i + 3500));\n  if (!deler.length) deler.push('{}');\n  deler.forEach(function (d, i) { props['s_' + navn + '_' + i] = d; });\n  props['s_' + navn + '_n'] = String(deler.length);\n  P.setProperties(props);\n  for (var j = deler.length; j < gammel; j++) P.deleteProperty('s_' + navn + '_' + j);\n}\nfunction nyRev() { var r = (+(P.getProperty('rev') || 0)) + 1; P.setProperty('rev', String(r)); return r; }\nfunction medLas(fn) { var l = LockService.getScriptLock(); l.waitLock(20000); try { return fn(); } finally { l.releaseLock(); } }\n\nfunction behandle(p) {\n  if (p.key !== NOKKEL) return { error: 'Feil n\u00f8kkel' };\n  try {\n    if (p.action === 'get') {\n      var rev = +(P.getProperty('rev') || 0);\n      if (p.rev != null && +p.rev === rev) return { same: true, rev: rev };\n      var st = {}; SAMLINGER.forEach(function (n) { var v = les(n); if (v) st[n] = v; });\n      return { rev: rev, state: st };\n    }\n    if (p.action === 'put') return medLas(function () {\n      var deler = String(p.path || '').split('/'), navn = deler[0];\n      if (SAMLINGER.indexOf(navn) < 0) return { error: 'Ukjent samling' };\n      if (deler.length === 1) skriv(navn, p.value);\n      else { var o = les(navn) || {}; if (p.value === null || p.value === undefined) delete o[deler[1]]; else o[deler[1]] = p.value; skriv(navn, o); }\n      return { rev: nyRev() };\n    });\n    if (p.action === 'putall') return medLas(function () {\n      SAMLINGER.forEach(function (n) { if (p.state && p.state[n] !== undefined) skriv(n, p.state[n]); });\n      return { rev: nyRev() };\n    });\n    if (p.action === 'ping') return { ok: true, kalendere: KALENDERE.map(function (id) { var c = kal(id); return c ? c.getName() : '(fant ikke ' + id + ')'; }) };\n    if (p.action === 'calendars') {\n      var prim = CalendarApp.getDefaultCalendar().getId();\n      return { calendars: CalendarApp.getAllCalendars().map(function (c) { return { id: c.getId(), name: c.getName(), primary: c.getId() === prim, color: c.getColor(), owned: c.isOwnedByMe() }; }) };\n    }\n    if (p.action === 'list') {\n      var fra = new Date(p.from), til = new Date(p.to), ut = [];\n      var ids = (p.cals && p.cals.length) ? p.cals : standardKalendere();\n      ids.forEach(function (id) {\n        var c = kal(id); if (!c) return;\n        c.getEvents(fra, til).forEach(function (ev) {\n          ut.push({ id: ev.getId(), title: ev.getTitle(), start: ev.getStartTime().toISOString(), end: ev.getEndTime().toISOString(),\n            allDay: ev.isAllDayEvent(), location: ev.getLocation(), desc: ev.getDescription(),\n            fam: ev.getTag('famId') || '', famMembers: ev.getTag('famMembers') || '', famEmoji: ev.getTag('famEmoji') || '', cal: c.getName(), calId: id, color: c.getColor() });\n        });\n      });\n      return { events: ut };\n    }\n    if (p.action === 'delete') { slett(p.id, p.cal); return { ok: true }; }\n    if (p.action === 'create' || p.action === 'update') { if (p.action === 'update' && p.id) slett(p.id, p.cal); return { id: lag(p) }; }\n    if (p.action === 'sonos_config') {\n      var st = Utilities.getUuid();\n      P.setProperties({ sonos_key: p.skey, sonos_secret: p.ssecret, sonos_redirect: p.redirect, sonos_state: st });\n      return { authUrl: 'https://api.sonos.com/login/v3/oauth?client_id=' + encodeURIComponent(p.skey) + '&response_type=code&state=' + st +\n        '&scope=playback-control-all&redirect_uri=' + encodeURIComponent(p.redirect) };\n    }\n    if (p.action === 'sonos_status') return { configured: !!P.getProperty('sonos_key'), connected: !!P.getProperty('sonos_refresh') };\n    if (p.action === 'sonos_off') { ['sonos_access', 'sonos_refresh', 'sonos_exp'].forEach(function (k) { P.deleteProperty(k); }); return { ok: true }; }\n    if (p.action === 'sonos') return sonosKall(p.path, p.method, p.body);\n    if (p.action === 'sonos_state') return sonosTilstand();\n    return { error: 'Ukjent handling' };\n  } catch (err) { return { error: String((err && err.message) || err) }; }\n}\n\nfunction slett(id, calId) {\n  var kandidater = calId ? [kal(calId)] : [kal(KALENDERE[0])].concat(CalendarApp.getAllOwnedCalendars());\n  for (var i = 0; i < kandidater.length; i++) {\n    var c = kandidater[i]; if (!c) continue;\n    try { var s = c.getEventSeriesById(id); if (s) { s.deleteEventSeries(); return; } } catch (e) {}\n    try { var ev = c.getEventById(id); if (ev) { ev.deleteEvent(); return; } } catch (e) {}\n  }\n}\n\nfunction lag(p) {\n  var c = kal(p.cal || KALENDERE[0]), opt = { location: p.location || '', description: p.desc || '' }, ev;\n  var s = dato(p.start), e = dato(p.end);\n  if (p.repeat === 'weekly' || p.repeat === 'yearly') {\n    var r = p.repeat === 'weekly' ? CalendarApp.newRecurrence().addWeeklyRule() : CalendarApp.newRecurrence().addYearlyRule();\n    ev = p.allDay ? c.createAllDayEventSeries(p.title, s, r, opt) : c.createEventSeries(p.title, s, e, r, opt);\n  } else {\n    ev = p.allDay ? (e > s ? c.createAllDayEvent(p.title, s, new Date(e.getFullYear(), e.getMonth(), e.getDate() + 1), opt) : c.createAllDayEvent(p.title, s, opt)) : c.createEvent(p.title, s, e, opt);\n  }\n  ev.setTag('famId', p.fam || ''); ev.setTag('famMembers', p.famMembers || ''); ev.setTag('famEmoji', p.famEmoji || '');\n  return ev.getId();\n}\n\n// ---- Sonos (Control API) ----\nfunction sonosAuthHeader() { return 'Basic ' + Utilities.base64Encode(P.getProperty('sonos_key') + ':' + P.getProperty('sonos_secret')); }\nfunction lagreSonos(j) {\n  var props = { sonos_access: j.access_token, sonos_exp: String(Date.now() + ((j.expires_in || 86400) - 120) * 1000) };\n  if (j.refresh_token) props.sonos_refresh = j.refresh_token;\n  P.setProperties(props);\n}\nfunction sonosTilbake(q) {\n  if (q.state !== P.getProperty('sonos_state')) return HtmlService.createHtmlOutput('<h2 style=\"font-family:sans-serif\">Ugyldig foresp\u00f8rsel \u2013 pr\u00f8v \u00abKoble til Sonos\u00bb p\u00e5 nytt.</h2>');\n  var r = UrlFetchApp.fetch('https://api.sonos.com/login/v3/oauth/access', { method: 'post', headers: { Authorization: sonosAuthHeader() },\n    payload: { grant_type: 'authorization_code', code: q.code, redirect_uri: P.getProperty('sonos_redirect') }, muteHttpExceptions: true });\n  var j = {}; try { j = JSON.parse(r.getContentText()); } catch (e) {}\n  if (!j.access_token) return HtmlService.createHtmlOutput('<h2 style=\"font-family:sans-serif\">Sonos-innlogging feilet</h2><pre>' + r.getContentText() + '</pre>');\n  lagreSonos(j);\n  return HtmlService.createHtmlOutput('<div style=\"font-family:sans-serif;padding:40px;text-align:center\"><h1>\u2705 Sonos er koblet til</h1><p>Du kan lukke denne fanen og g\u00e5 tilbake til familieskjermen.</p></div>');\n}\nfunction sonosToken() {\n  if (+(P.getProperty('sonos_exp') || 0) > Date.now() && P.getProperty('sonos_access')) return P.getProperty('sonos_access');\n  var ref = P.getProperty('sonos_refresh'); if (!ref) throw new Error('Sonos er ikke koblet til');\n  var r = UrlFetchApp.fetch('https://api.sonos.com/login/v3/oauth/access', { method: 'post', headers: { Authorization: sonosAuthHeader() },\n    payload: { grant_type: 'refresh_token', refresh_token: ref }, muteHttpExceptions: true });\n  var j = JSON.parse(r.getContentText()); if (!j.access_token) throw new Error('Sonos: kunne ikke fornye innlogging');\n  lagreSonos(j); return j.access_token;\n}\nfunction sonosReq(path, method, body, tok) {\n  var o = { url: 'https://api.ws.sonos.com/control/api/v1' + path, method: method || 'get', headers: { Authorization: 'Bearer ' + tok }, muteHttpExceptions: true, contentType: 'application/json' };\n  if (body) o.payload = JSON.stringify(body);\n  return o;\n}\nfunction tolk(r) { var t = r.getContentText(); try { return t ? JSON.parse(t) : {}; } catch (e) { return { raw: t }; } }\nfunction sonosKall(path, method, body) {\n  var tok = sonosToken(), r = UrlFetchApp.fetchAll([sonosReq(path, method, body, tok)])[0];\n  return { status: r.getResponseCode(), data: tolk(r) };\n}\nfunction sonosTilstand() {\n  var tok = sonosToken();\n  var hh = tolk(UrlFetchApp.fetchAll([sonosReq('/households', 'get', null, tok)])[0]).households || [];\n  if (!hh.length) return { households: [] };\n  var hid = hh[0].id, g = tolk(UrlFetchApp.fetchAll([sonosReq('/households/' + hid + '/groups', 'get', null, tok)])[0]);\n  var groups = g.groups || [], reqs = [];\n  groups.forEach(function (gr) {\n    reqs.push(sonosReq('/groups/' + gr.id + '/playback', 'get', null, tok));\n    reqs.push(sonosReq('/groups/' + gr.id + '/playbackMetadata', 'get', null, tok));\n    reqs.push(sonosReq('/groups/' + gr.id + '/groupVolume', 'get', null, tok));\n  });\n  var res = reqs.length ? UrlFetchApp.fetchAll(reqs) : [];\n  groups.forEach(function (gr, i) { gr.playback = tolk(res[i * 3]); gr.meta = tolk(res[i * 3 + 1]); gr.volume = tolk(res[i * 3 + 2]); });\n  return { household: hid, groups: groups, players: g.players || [] };\n}\n";
const GAS={events:LS.get('fam_gas',{ev:[]}).ev||[],err:'',ok:false};

async function gasCall(payload){const {url,key}=gasCfg();if(!url)return null;

function calHtml(){
  const now=new Date();if(!calMonth)calMonth=new Date(now.getFullYear(),now.getMonth(),1);
  const y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1),start=addDays(first,-((first.getDay()+6)%7));
  let cells='';['må','ty','on','to','fr','la','su'].forEach(w=>cells+=`<div class="wd">${w}</div>`);
  for(let i=0;i<42;i++){const d=addDays(start,i);if(i>=35&&d.getMonth()!==m)break;
    const its=itemsForDay(d),red=d.getDay()===0||its.some(x=>x.red),now_=ymd(d)===ymd(now);
    const mk=its.filter(x=>x.kind!=='train').slice(0,3).map(()=>'<i></i>').join('');
    cells+=`<div class="d ${d.getMonth()!==m?'o':''} ${red?'red':''} ${now_?'now':''}" onclick="App.day('${ymd(d)}')">${d.getDate()}${mk?`<span class="mk">${mk}</span>`:''}</div>`}
  return `<div class="sh-head"><h2>${cap(MONTHS[m])} ${y}</h2><span class="calnav"><button onclick="App.calNav(-1)" aria-label="Førre månad">‹</button><button onclick="App.calNav(0)" aria-label="Denne månaden">•</button><button onclick="App.calNav(1)" aria-label="Neste månad">›</button></span><button class="x" onclick="App.back()" aria-label="Lukk">✕</button></div><div class="cal" style="max-width:560px;margin:0 auto">${cells}</div>`;
}

  const y=calMonth.getFullYear(),m=calMonth.getMonth(),first=new Date(y,m,1),start=addDays(first,-((first.getDay()+6)%7));
  const ws=ymd(weekStart()),we=ymd(addDays(weekStart(),L.weekend?6:4));
  let cells='';['mån','tys','ons','tor','fre','lau','sun'].forEach(w=>cells+=`<div class="wd">${w}</div>`);

/* ============ Modal-system ============ */
let stack=[];
function view(fn){stack.push(fn);showTop()}
function showTop(){const m=$('#modal');if(!stack.length){m.classList.add('hidden');$('#sheet').innerHTML='';return}
  $('#sheet').innerHTML=stack[stack.length-1]();m.classList.remove('hidden');postRender()}
function back(){stack.pop();showTop()}
function closeAll(){stack=[];showTop()}
function refreshView(){if(!stack.length)return;const top=stack[stack.length-1];
  if(top.live&&!document.activeElement?.matches('input,select,textarea')){const sc=$('#sheet').scrollTop;$('#sheet').innerHTML=top();$('#sheet').scrollTop=sc;postRender()}}
const head=(title,sub,extra='')=>`<div class="sh-head">${extra}<h2>${title}${sub?`<small>${sub}</small>`:''}</h2><button class="x" onclick="App.back()" aria-label="Lukk">✕</button></div>`;
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};

function toast(msg,action,fn){const t=$('#toast');t.innerHTML=`<span>${msg}</span>${action?`<button class="btn sm pri" id="tAct">${action}</button>`:''}`;
  if(action)$('#tAct').onclick=()=>{fn();t.classList.remove('show')};t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('show'),action?6000:2600)}
function coins(el,n=8){const r=el.getBoundingClientRect();for(let i=0;i<n;i++){const c=document.createElement('span');c.className='coin';c.textContent=i%3?'🪙':'✨';
  c.style.left=(r.left+r.width/2)+'px';c.style.top=(r.top+r.height/2)+'px';c.style.setProperty('--dx',(Math.random()*240-120)+'px');c.style.setProperty('--dy',(120+Math.random()*140)+'px');c.style.setProperty('--r',(Math.random()*360-180)+'deg');
  c.style.animationDelay=(i*40)+'ms';document.body.appendChild(c);setTimeout(()=>c.remove(),1600)}}

let pinBuf='',pinRes=null;
function pinView(){const L_=String(S.settings.pin||'').length||4;
  return head('🔒 Foreldre-PIN','Skriv inn PIN for å halde fram')+`<div class="pin" id="pinBox"><div class="dots2">${Array.from({length:L_},(_,i)=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('')}</div>
  <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="App.pinKey('${n}')">${n}</button>`).join('')}<button onclick="App.pinKey('c')" aria-label="Avbryt" style="font-size:18px">Avbryt</button><button onclick="App.pinKey('0')">0</button><button onclick="App.pinKey('b')" aria-label="Slett">⌫</button></div>
  <p class="hint" style="margin-top:16px">Standard-PIN er 1234 – byt han under ⚙️ → Tryggleik.</p></div>`}
function askPin(){return new Promise(res=>{pinBuf='';pinRes=res;view(pinView)})}
function pinKey(k){const P=String(S.settings.pin||'');
  if(k==='c'){back();pinRes&&pinRes(false);pinRes=null;return}
  if(k==='b')pinBuf=pinBuf.slice(0,-1);else pinBuf+=k;
  if(pinBuf.length>=P.length){if(pinBuf===P){stack.pop();const r=pinRes;pinRes=null;showTop();r&&r(true);return}
    pinBuf='';$('#sheet').innerHTML=pinView();const b=$('#pinBox');b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),450);return}
  $('#sheet').innerHTML=pinView();
}

    `<div class="row" style="margin-top:18px"><button class="btn pri" onclick="App.editEvent(null,'${ds}')">＋ Ny hending denne dagen</button></div>`};

function memberEditView(id){
  const m=id?S.members[id]:{name:'',emoji:'🙂',color:pick(COLORS),kid:true,birthday:''};
  let col=m.color;
  return ()=>head(id?'Endre medlem':'Nytt familiemedlem','')+`

   <label class="f">Farge</label><input type="hidden" id="mCol" value="${esc(col)}"><div class="colors">${COLORS.map(c=>`<button type="button" class="${c===col?'on':''}" style="background:${c}" onclick="document.getElementById('mCol').value='${c}';this.parentNode.querySelectorAll('button').forEach(b=>b.classList.remove('on'));this.classList.add('on')" aria-label="${c}"></button>`).join('')}</div>
   <label class="f">Bursdag</label><input type="date" id="mBday" value="${esc(m.birthday||'')}">
   <label class="f">Søkeord for Spond/Google-hendelser (skilles med komma)</label><input id="mKeys" value="${esc(m.keywords||'')}" placeholder="F.eks. G12, fotball, Sogndal IL">
   <label class="row" style="margin-top:16px;gap:10px"><input type="checkbox" id="mKid" ${m.kid?'checked':''}> Born (får eigen saldo og kan registrere oppgåver)</label>
   <div class="row" style="margin-top:20px;justify-content:space-between">${id?`<button class="btn dng" id="mDel" onclick="App.delMember('${id}',this)">Slett</button>`:'<span></span>'}<button class="btn pri" onclick="App.saveMember(${id?`'${id}'`:'null'})">Lagre</button></div>`;
}

function partyStart(){const c=$('#restFx'),g=c.getContext('2d');let W,H;const dpr=Math.min(2,window.devicePixelRatio||1);
  const size=()=>{W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)};size();window.addEventListener('resize',size);

  for(let i=0;i<8;i++)PF.balloons.push({x:R()*W,y:H*.3+R()*H*.8,r:20+R()*16,vy:.35+R()*.5,ph:R()*6,col:pick(COL)});
  const loop=t=>{const dt=Math.min(50,t-PF.last)/16.7;PF.last=t;g.clearRect(0,0,W,H);
    if(t>PF.nextRocket){PF.nextRocket=t+500+R()*900;PF.rockets.push({x:W*(.1+R()*.8),y:H+10,vx:(R()-.5)*1.2,vy:-Math.sqrt(2*.12*H*(.5+R()*.38)),col:pick(COL),trail:[]})}

      g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1;g.beginPath();g.moveTo(x,b.y+r*1.15);g.quadraticCurveTo(x+Math.sin(b.ph*2)*9,b.y+r*2,x,b.y+r*3);g.stroke();
      g.fillStyle=b.col;g.globalAlpha=.92;g.beginPath();g.ellipse(x,b.y,r*.86,r*1.08,0,0,7);g.fill();

      g.globalAlpha=.35;g.fillStyle='#fff';g.beginPath();g.ellipse(x-r*.3,b.y-r*.4,r*.18,r*.3,-.5,0,7);g.fill();g.globalAlpha=1;

      g.strokeStyle=k.col;g.lineWidth=2;g.globalAlpha=.8;g.beginPath();k.trail.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.lineTo(k.x,k.y);g.stroke();g.globalAlpha=1;

function floatSet(list){const key=list.join('|');if(key===FL.key&&(FL.raf||!list.length))return;FL.key=key;
  const box=$('#rfloat');box.innerHTML='';FL.items=[];if(FL.raf){cancelAnimationFrame(FL.raf);FL.raf=0}

    const w=el.offsetWidth,hh=el.offsetHeight,a=Math.random()*Math.PI*2,sp=22+Math.random()*16;

  FL.last=performance.now();
  const loop=t=>{const dt=Math.min(.1,(t-FL.last)/1000);FL.last=t;const W=box.clientWidth,H=box.clientHeight;
    FL.items.forEach(o=>{o.x+=o.vx*dt;o.y+=o.vy*dt;o.ph+=dt;
      if(o.x<8){o.x=8;o.vx=Math.abs(o.vx)}if(o.x>W-o.w-8){o.x=W-o.w-8;o.vx=-Math.abs(o.vx)}

function tick(force){
  renderClock();const now=new Date(),mk=hm(now);
  if(restOn)renderRestClock();else if(+L.restMin>0&&Date.now()-lastAct>L.restMin*60e3&&!document.body.classList.contains('shopmode'))showRest();
  if(mk!==lastMin||force){lastMin=mk;
    if(ymd(now)!==lastDay){lastDay=ymd(now);calMonth=null;loadHistory();loadSun()}
    applyTheme();renderTop();renderFamily();if(restOn)renderRest();
    if(now.getMinutes()%5===0||force){renderAgenda();renderCal();renderSoon()}
    if(now.getMinutes()%30===0)loadWeather();
    // tilbake til hovedskjerm etter 3 min utan berøring
    if(stack.length&&Date.now()-lastAct>180e3)closeAll();
  }
}

/* ============ Start ============ */
FX.init();
render();renderClock();
loadWeather();loadHistory();loadPlaces();loadNetatmo();loadGcal();loadGas();
spHandleRedirect().then(spPoll);
setInterval(()=>{if(S.settings.sonosOn&&!document.hidden&&stack.length&&stack[stack.length-1]===musicViewFn)soLoad()},4000);
route();
setInterval(()=>{if(Sync.base()&&!document.hidden&&(document.body.classList.contains('shopmode')||(stack.length&&stack[stack.length-1]===shopViewFn)))Sync.pull()},5000);
setInterval(()=>{if(SP.tok&&!document.hidden){if(stack.length&&stack[stack.length-1]===musicViewFn)refreshView();if(Date.now()-(SP.pollAt||0)>(isNight()?30e3:6e3))spPoll()}},1000);
setInterval(()=>{if(!document.hidden){loadNetatmo();loadGcal();loadPlaces()}},10*60e3);
setInterval(()=>{if(!document.hidden)loadGas()},3*60e3);
setInterval(tick,1000);
setInterval(()=>{if(HIST.length>1&&!document.hidden){histI++;renderHist()}},25000);
renderFun(true);setTimeout(()=>setInterval(()=>{if(!document.hidden){funI++;renderFun()}},25000),12500);
if(Sync.base())Sync.pull();
setInterval(()=>{if(Sync.base()&&!document.hidden)Sync.pull()},20000);
if(firstRun&&location.hash!=='#handleliste')setTimeout(()=>toast('👋 Velkomen! Trykk ⚙️ for å leggje inn familien.'),1200);
</script>
</body>
